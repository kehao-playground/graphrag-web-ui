name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # node24-runtime actions (Node 20 deprecated on runners 2025-09);
      # setup-uv pinned exact — floating major tags discontinued after v8
      - uses: actions/checkout@v7
      # testcontainers needs docker — the GitHub ubuntu runner has it built in
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      # spec A5.2 contract gate: committed openapi.json must match the code
      - run: uv run python scripts/gen_openapi.py
      - run: git diff --exit-code ../openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint existed as a script long before this gate did. The ratchet on
      # its pre-existing React warnings reached zero (R1-53): --max-warnings=0
      # in package.json, so any warning fails CI.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # `npm run screenshots` needs a live stack, so CI only parses it; the
      # labels come from the catalogs, so copy changes cannot break it (R1-25)
      - run: node --check scripts/capture-screens.mjs
      # spec A5.2 contract gate: committed types.generated.ts must match openapi.json
      - run: npm run gen:types
      - run: git diff --exit-code src/api/types.generated.ts

  audit:
    # Required (decision D8). An advisory that cannot be fixed yet and is not
    # reachable here is accepted by id in the dated list below, with its
    # reason; everything else fails the build. Dependabot opens the bumps
    # for declared dependencies; transitive ones are raised through
    # [tool.uv] override-dependencies in backend/pyproject.toml (nltk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # --skip-editable: the environment contains graphrag-ui itself, which is
      # not on PyPI and can never be audited. NOT --strict: it escalates every
      # unauditable/skipped dependency into an error, so it fails on that same
      # local project either way. A real advisory still exits non-zero.
      # Accepted advisories (review each when nltk releases):
      # - PYSEC-2026-3740 (2026-09-30, F26): nltk model-path sandbox bypass
      #   (TransitionParser, AveragedPerceptron save/load); no fixed release.
      #   graphrag never passes a caller-controlled model path to these APIs.
      - run: >-
          uv run --with pip-audit pip-audit --desc --skip-editable
          --ignore-vuln PYSEC-2026-3740
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    # Compose-enforced ${VAR:?} vars: the runner's compose treats an empty
    # value in the env file as UNSET for `:?` interpolation (tightened vs
    # older versions), and .env.example ships BOOTSTRAP_ADMIN_* empty on
    # purpose. Job-level env lets every compose step (config x2, build)
    # inherit CI-only values; config/build never run containers, so these
    # credentials are never used anywhere.
    env:
      BOOTSTRAP_ADMIN_EMAIL: ci@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-not-a-real-secret
      # .env.example ships JWT_SECRET empty on purpose (the api refuses a
      # placeholder at startup), and compose reads empty as unset for `:?`
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config
      - name: proxy-auth overlay compose config
        env:
          PROXY_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          PROXY_ADMIN_EMAILS: admin@example.com
          OAUTH2_PROXY_ISSUER_URL: https://idp.example.com
          OAUTH2_PROXY_CLIENT_ID: graphrag-ui
          OAUTH2_PROXY_CLIENT_SECRET: ci
          OAUTH2_PROXY_COOKIE_SECRET: Y2ktY29va2llLXNlY3JldC0zMg==
          OAUTH2_PROXY_REDIRECT_URL: http://localhost:8080/oauth2/callback
        run: docker compose -f docker-compose.yml -f docker-compose.proxy-auth.yml config
      # The overlay's oauth2-proxy upstream must point at the port the web
      # nginx actually listens on: the image moved 80 -> 8080 once and the
      # overlay silently 502'd for weeks (R3-02). The full compose smoke
      # (the smoke job) exercises it for real; this keeps the two files honest.
      - name: proxy-auth overlay upstream matches the web nginx listen port
        run: |
          port=$(sed -n 's/^ *listen \([0-9][0-9]*\);.*/\1/p' frontend/nginx.conf)
          test -n "$port"
          grep -q "uri: http://web:${port}$" docker-compose.proxy-auth.yml
      # Guards the compose image builds: catches Dockerfile drift that unit
      # tests never see (e.g. missing .npmrc once broke `npm ci` in-container)
      - run: docker compose build

  smoke:
    # Boots the shipped stack and sends real requests through the web nginx
    # (R2-15): sign-in, project create, a 2 MiB upload past nginx's 1 MiB
    # default body cap, /api/ready; then the proxy-auth overlay against the
    # test IdP, expecting 401 on /api/*. See .github/scripts/compose-smoke.sh.
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_ADMIN_EMAIL: ci@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-not-a-real-secret
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: .github/scripts/compose-smoke.sh local
      - run: .github/scripts/compose-smoke.sh proxy

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # charts/ contains the vendored bitnami/postgresql; no extra helm repo needed
      - run: helm lint deploy/helm/graphrag-ui
      - run: helm template deploy/helm/graphrag-ui > /dev/null
      - run: |
          helm template deploy/helm/graphrag-ui --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql+asyncpg://u:p@h:5432/d \
            | grep -q 'postgresql+asyncpg://u:p@h:5432/d' && echo "external DB wired"
      # Every registry image the default render references must be pullable:
      # the bundled postgres once pointed at a tag Docker Hub no longer had
      # (R3-03), so a default `helm install` sat in ImagePullBackOff. The
      # chart's own api/web images carry no registry and are built locally.
      - name: default-render images exist on their registries
        run: |
          helm template deploy/helm/graphrag-ui \
            | sed -n 's/^ *image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | sort -u | grep '/' \
            | while read -r image; do
                docker manifest inspect "$image" > /dev/null || { echo "MISSING $image"; exit 1; }
                echo "ok $image"
              done
      # Ingress carries the upload body-size cap (R3-15): uploadMaxFileMb + 1 MiB slack
      - name: ingress proxy-body-size tracks uploadMaxFileMb
        run: |
          helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set uploadMaxFileMb=120 \
            | grep -q 'nginx.ingress.kubernetes.io/proxy-body-size: 121m'
      # R3-16: no ingress backend may point at the api Service. The api
      # NetworkPolicy admits only the web and oauth2-proxy pods, so a direct
      # ingress -> api route times out on a policy-enforcing CNI.
      - name: ingress routes /api through the web service
        run: |
          for extra in "" "--set ingress.host=graphrag.example.com --set proxyAuth.enabled=true --set proxyAuth.emailDomains={example.com}"; do
            # backend service names only (the proxy-mode /api Ingress is itself named *-api)
            out=$(helm template deploy/helm/graphrag-ui --set ingress.enabled=true $extra \
              | sed -n '/^kind: Ingress/,/^---/p' | grep -A1 'service:' | grep 'name:')
            echo "$out" | grep -q 'name: release-name-graphrag-ui-web'
            if echo "$out" | grep -q 'name: release-name-graphrag-ui-api$'; then
              echo "ingress routes to the api service ($extra)"; exit 1
            fi
          done
      # R3-30: an existing claim replaces the chart's workspace PVC
      - name: persistence.existingClaim is mounted and no PVC is created
        run: |
          out=$(helm template deploy/helm/graphrag-ui --set persistence.existingClaim=ws-data)
          echo "$out" | grep -q 'claimName: ws-data'
          if echo "$out" | grep -q 'graphrag-ui-workspaces'; then echo "chart PVC still rendered"; exit 1; fi
      # proxy-auth misconfigurations fail at render time, not as a 401 wall
      # (R3-17). `if … ; then exit 1` rather than `! …`: bash's errexit
      # ignores a negated pipeline, so `!` would never fail the step.
      - name: proxy-auth render guards
        run: |
          if helm template deploy/helm/graphrag-ui --set proxyAuth.enabled=true \
              --set 'proxyAuth.emailDomains={example.com}' > /dev/null 2>&1; then
            echo "rendered without ingress.enabled"; exit 1
          fi
          if helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set proxyAuth.enabled=true \
              --set 'proxyAuth.emailDomains={example.com}' > /dev/null 2>&1; then
            echo "rendered without ingress.host"; exit 1
          fi
          helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set ingress.host=graphrag.example.com \
              --set proxyAuth.enabled=true --set 'proxyAuth.emailDomains={example.com}' \
            | grep -q 'auth-signin: https://graphrag.example.com/oauth2/start'
      # Spec 2026-08-27 deploy checks: the Ingress count per value set, and
      # auth-signin on the app Ingress only (the /api Ingress must answer 401).
      - name: proxy-auth value sets render the expected Ingresses
        run: |
          check() {  # <ingresses> <ships oauth2-proxy: 0|1> <helm args...>
            want=$1 ships=$2; shift 2
            out=$(helm template deploy/helm/graphrag-ui --set ingress.enabled=true \
              --set ingress.host=graphrag.example.com "$@")
            test "$(echo "$out" | grep -c '^kind: Ingress')" = "$want"
            test "$(echo "$out" | grep -c 'auth-signin' || true)" = "$(( want > 1 ? 1 : 0 ))"
            proxies=$(echo "$out" | grep -c 'name: release-name-graphrag-ui-oauth2-proxy$' || true)
            if [ "$ships" = 1 ] && [ "$proxies" = 0 ]; then echo "no oauth2-proxy: $*"; exit 1; fi
            if [ "$ships" = 0 ] && [ "$proxies" != 0 ]; then echo "oauth2-proxy rendered: $*"; exit 1; fi
            if [ "$want" -gt 1 ]; then
              # the one auth-signin sits on the app Ingress (named without a suffix)
              echo "$out" | awk '/^kind: Ingress/ {i=1} /^---/ {i=0; n=""}
                i && /^  name:/ {n=$2} i && /auth-signin/ {print n}' \
                | grep -qx 'release-name-graphrag-ui'
            fi
            echo "ok $want ingress(es): $*"
          }
          check 1 0
          check 3 1 --set proxyAuth.enabled=true --set 'proxyAuth.emailDomains={example.com}'
          check 2 0 --set proxyAuth.enabled=true --set proxyAuth.external.url=https://sso.example.com

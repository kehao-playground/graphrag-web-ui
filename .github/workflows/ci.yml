name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # node24-runtime actions (Node 20 deprecated on runners 2025-09);
      # setup-uv pinned exact — floating major tags discontinued after v8
      - uses: actions/checkout@v7
      # testcontainers needs docker — the GitHub ubuntu runner has it built in
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      # spec A5.2 contract gate: committed openapi.json must match the code
      - run: uv run python scripts/gen_openapi.py
      - run: git diff --exit-code ../openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint existed as a script long before this gate did. --max-warnings
      # (in package.json) ratchets the six pre-existing React warnings: a new
      # one fails CI, fixing one keeps passing.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # spec A5.2 contract gate: committed types.generated.ts must match openapi.json
      - run: npm run gen:types
      - run: git diff --exit-code src/api/types.generated.ts

  audit:
    # Advisory-only: a fresh CVE in a transitive dep must not block an
    # unrelated PR, but it has to be visible. Dependabot opens the bumps.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # --skip-editable: the environment contains graphrag-ui itself, which is
      # not on PyPI and can never be audited. NOT --strict: it escalates every
      # unauditable/skipped dependency into an error, so it fails on that same
      # local project either way. A real advisory still exits non-zero.
      - run: uv run --with pip-audit pip-audit --desc --skip-editable
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    # Compose-enforced ${VAR:?} vars: the runner's compose treats an empty
    # value in the env file as UNSET for `:?` interpolation (tightened vs
    # older versions), and .env.example ships BOOTSTRAP_ADMIN_* empty on
    # purpose. Job-level env lets every compose step (config x2, build)
    # inherit CI-only values; config/build never run containers, so these
    # credentials are never used anywhere.
    env:
      BOOTSTRAP_ADMIN_EMAIL: ci@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-not-a-real-secret
      # .env.example ships JWT_SECRET empty on purpose (the api refuses a
      # placeholder at startup), and compose reads empty as unset for `:?`
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config
      - name: proxy-auth overlay compose config
        env:
          PROXY_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          PROXY_ADMIN_EMAILS: admin@example.com
          OAUTH2_PROXY_ISSUER_URL: https://idp.example.com
          OAUTH2_PROXY_CLIENT_ID: graphrag-ui
          OAUTH2_PROXY_CLIENT_SECRET: ci
          OAUTH2_PROXY_COOKIE_SECRET: Y2ktY29va2llLXNlY3JldC0zMg==
          OAUTH2_PROXY_REDIRECT_URL: http://localhost:8080/oauth2/callback
        run: docker compose -f docker-compose.yml -f docker-compose.proxy-auth.yml config
      # The overlay's oauth2-proxy upstream must point at the port the web
      # nginx actually listens on: the image moved 80 -> 8080 once and the
      # overlay silently 502'd for weeks (R3-02). The full compose smoke
      # (R2-15) will exercise it for real; this keeps the two files honest.
      - name: proxy-auth overlay upstream matches the web nginx listen port
        run: |
          port=$(sed -n 's/^ *listen \([0-9][0-9]*\);.*/\1/p' frontend/nginx.conf)
          test -n "$port"
          grep -q "uri: http://web:${port}$" docker-compose.proxy-auth.yml
      # Guards the compose image builds: catches Dockerfile drift that unit
      # tests never see (e.g. missing .npmrc once broke `npm ci` in-container)
      - run: docker compose build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # charts/ contains the vendored bitnami/postgresql; no extra helm repo needed
      - run: helm lint deploy/helm/graphrag-ui
      - run: helm template deploy/helm/graphrag-ui > /dev/null
      - run: |
          helm template deploy/helm/graphrag-ui --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql+asyncpg://u:p@h:5432/d \
            | grep -q 'postgresql+asyncpg://u:p@h:5432/d' && echo "external DB wired"
      # Every registry image the default render references must be pullable:
      # the bundled postgres once pointed at a tag Docker Hub no longer had
      # (R3-03), so a default `helm install` sat in ImagePullBackOff. The
      # chart's own api/web images carry no registry and are built locally.
      - name: default-render images exist on their registries
        run: |
          helm template deploy/helm/graphrag-ui \
            | sed -n 's/^ *image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' | sort -u | grep '/' \
            | while read -r image; do
                docker manifest inspect "$image" > /dev/null || { echo "MISSING $image"; exit 1; }
                echo "ok $image"
              done
      # Ingress carries the upload body-size cap (R3-15): uploadMaxFileMb + 1 MiB slack
      - name: ingress proxy-body-size tracks uploadMaxFileMb
        run: |
          helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set uploadMaxFileMb=120 \
            | grep -q 'nginx.ingress.kubernetes.io/proxy-body-size: 121m'
      # proxy-auth misconfigurations fail at render time, not as a 401 wall
      # (R3-17). `if … ; then exit 1` rather than `! …`: bash's errexit
      # ignores a negated pipeline, so `!` would never fail the step.
      - name: proxy-auth render guards
        run: |
          if helm template deploy/helm/graphrag-ui --set proxyAuth.enabled=true \
              --set 'proxyAuth.emailDomains={example.com}' > /dev/null 2>&1; then
            echo "rendered without ingress.enabled"; exit 1
          fi
          if helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set proxyAuth.enabled=true \
              --set 'proxyAuth.emailDomains={example.com}' > /dev/null 2>&1; then
            echo "rendered without ingress.host"; exit 1
          fi
          helm template deploy/helm/graphrag-ui --set ingress.enabled=true --set ingress.host=graphrag.example.com \
              --set proxyAuth.enabled=true --set 'proxyAuth.emailDomains={example.com}' \
            | grep -q 'auth-signin: https://graphrag.example.com/oauth2/start'

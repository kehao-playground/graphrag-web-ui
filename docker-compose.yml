services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: graphrag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:                      # the api runs alembic at startup; PG must be truly ready first
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
      WORKSPACES_DIR: /data/workspaces
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # ⚠ Must be a real routable domain, never .local — login validation rejects special-use domains
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-50}    # single-file upload limit, MiB (default 50)
      PROJECT_QUOTA_MB: ${PROJECT_QUOTA_MB:-5000}      # per-project storage quota, MiB (default 5000)
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}   # concurrent indexing jobs; 0 disables the runner
      JOB_LOG_RETENTION_DAYS: ${JOB_LOG_RETENTION_DAYS:-30}          # days to keep succeeded job logs
      JOB_LOG_FAILED_RETENTION_DAYS: ${JOB_LOG_FAILED_RETENTION_DAYS:-90}  # days to keep failed job logs
      UPDATE_OUTPUT_KEEP_LATEST: ${UPDATE_OUTPUT_KEEP_LATEST:-2}     # update_output timestamp dirs kept
      CACHE_QUOTA_MB: ${CACHE_QUOTA_MB:-2048}         # cache volume quota reported by preflight, MiB
      DISK_WATERMARK_MB: ${DISK_WATERMARK_MB:-2048}   # min free MiB on workspaces volume; below → refuse
      QUERY_CACHE_MB: ${QUERY_CACHE_MB:-1024}      # LRU frame-cache budget for query parquet frames, MiB
      QUERY_RATE_LIMIT_PER_HOUR: ${QUERY_RATE_LIMIT_PER_HOUR:-30}  # max queries per (user, project) per hour → 429
      GRAPH_NODE_LIMIT: ${GRAPH_NODE_LIMIT:-2000}  # max nodes per graph response (highest degree first)
    volumes: [workspaces:/data/workspaces]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./frontend
    ports: ["8080:8080"]   # nginx-unprivileged listens on 8080 inside the container
    depends_on: [api]
volumes:
  pgdata:
  workspaces:

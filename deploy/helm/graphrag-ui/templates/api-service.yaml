apiVersion: v1
kind: Service
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "graphrag-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
    # Port 8000 exposed directly: the web nginx upstream is hardcoded to
    # http://api:8000 (nginx.conf pinned by the brief); connections arriving
    # via the `api` ExternalName alias land on this port — without it they
    # get connection refused
    - name: api
      port: 8000
      targetPort: 8000

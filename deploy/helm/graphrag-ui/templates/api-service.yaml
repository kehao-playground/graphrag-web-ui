apiVersion: v1
kind: Service
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "graphrag-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
    # 8000 直開:web 的 nginx 上游寫死 http://api:8000(nginx.conf 由 brief 釘死),
    # 經 `api` ExternalName alias 進來的連線打的是這個埠,沒有它會 connection refused
    - name: api
      port: 8000
      targetPort: 8000

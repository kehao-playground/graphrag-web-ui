apiVersion: v1
kind: Service
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "graphrag-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-workspaces
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteOnce   # pairs with api single-replica + Recreate (spec §8.2)
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-workspaces
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteOnce   # 與 api 單副本 + Recreate 配套(spec §8.2)
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

# nginx.conf (pinned by the brief) reverse-proxies /api/ to the static upstream
# http://api:8000 — nginx resolves the upstream name the moment its config
# loads, and a K8s namespace has no `api` DNS name by default; without this
# alias the web container exits with [emerg] and crash-loops (regardless of
# ingress). ExternalName makes `api` a CNAME to <fullname>-api; port 8000 is
# opened separately by api-service.yaml. Note: the name `api` is dictated by
# nginx.conf, so a namespace supports only a single release.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ExternalName
  externalName: {{ include "graphrag-ui.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local
  ports:
    - name: http
      port: 8000

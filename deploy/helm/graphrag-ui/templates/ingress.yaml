{{- if .Values.ingress.enabled }}
{{- $auth := dict "url" "" "signin" "" }}
{{- if .Values.proxyAuth.enabled }}
  {{- if .Values.proxyAuth.external.url }}
    {{- $_ := set $auth "url" (printf "%s/oauth2/auth" .Values.proxyAuth.external.url) }}
    {{- $_ := set $auth "signin" (printf "%s/oauth2/start?rd=$escaped_request_uri" .Values.proxyAuth.external.url) }}
  {{- else }}
    {{- $_ := set $auth "url" (printf "http://%s-oauth2-proxy.%s.svc.cluster.local/oauth2/auth" (include "graphrag-ui.fullname" .) .Release.Namespace) }}
    {{- $_ := set $auth "signin" (printf "https://%s/oauth2/start?rd=$escaped_request_uri" .Values.ingress.host) }}
  {{- end }}
{{- end }}
{{/* Shared per-path annotations: SSE needs buffering off and a long read timeout (spec §8.2);
     uploads need the body-size cap raised above ingress-nginx's 1m default, or every file over
     1 MiB dies as an HTML 413 before the web nginx (which allows 1g) and the api's own
     UPLOAD_MAX_FILE_MB check ever see it. Sized from uploadMaxFileMb plus 1 MiB of multipart
     and JSON-envelope slack so the api stays the authority on the limit. */}}
{{- $bodySize := printf "%dm" (add .Values.uploadMaxFileMb 1) }}
{{- $shared := dict "nginx.ingress.kubernetes.io/proxy-buffering" "off" "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-body-size" $bodySize }}
{{- $authAnnotations := dict }}
{{- if .Values.proxyAuth.enabled }}
  {{- $authAnnotations = dict "nginx.ingress.kubernetes.io/auth-url" $auth.url "nginx.ingress.kubernetes.io/auth-response-headers" "X-Forwarded-Email,X-Forwarded-Preferred-Username,X-Proxy-Secret" }}
{{- end }}
{{- if not .Values.proxyAuth.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graphrag-ui.fullname" . }}
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
  annotations:
    # SSE (spec §8.2): the ingress must disable buffering and extend the read timeout, or streamed queries stall
    {{- toYaml (merge (dict) $shared .Values.ingress.annotations) | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-api
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-web
                port: { number: 80 }
{{- else }}
{{- $apiAnnotations := merge (dict) $shared $authAnnotations .Values.ingress.annotations }}
{{- $appAnnotations := merge (dict) $shared $authAnnotations (dict "nginx.ingress.kubernetes.io/auth-signin" $auth.signin) .Values.ingress.annotations }}
# /api sends no signin redirect: fetch clients get 401 instead of an HTML redirect-to-login (spec decision 5)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
  annotations:
    # SSE (spec §8.2): the ingress must disable buffering and extend the read timeout, or streamed queries stall
    {{- toYaml $apiAnnotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-api
                port: { number: 80 }
---
# app root: browser navigation still gets the interactive oauth2-proxy login
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graphrag-ui.fullname" . }}
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
  annotations:
    # SSE (spec §8.2): the ingress must disable buffering and extend the read timeout, or streamed queries stall
    {{- toYaml $appAnnotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-web
                port: { number: 80 }
{{- if not .Values.proxyAuth.external.url }}
---
# /oauth2 unguarded: oauth2-proxy's own login/callback endpoints must stay reachable
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-oauth2-proxy
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-oauth2-proxy
                port: { number: 80 }
{{- end }}
{{- end }}
{{- end }}

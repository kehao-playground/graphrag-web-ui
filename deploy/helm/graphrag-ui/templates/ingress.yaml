{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graphrag-ui.fullname" . }}
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
  annotations:
    # SSE(spec §8.2):ingress 必須關 buffering、拉長 read timeout,否則串流查詢會被卡住
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-api
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "graphrag-ui.fullname" . }}-web
                port: { number: 80 }
{{- end }}

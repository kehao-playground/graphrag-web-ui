apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-api
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: {{ .Values.api.strategy }}
  selector:
    matchLabels:
      {{- include "graphrag-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "graphrag-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      # fsGroup is what makes the RWO workspace PVC writable by the image's
      # non-root uid — without it the first `graphrag init` fails on EACCES.
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      # spec §8.2 also plans a preStop hook for job drain-back — deferred until the Phase 3 reconciler exposes a callable endpoint
      containers:
        - name: api
          image: "{{ .Values.api.image.repository | default "graphrag-ui-api" }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # Seven fixed env vars (spec §8.3), same names shared with docker-compose
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "graphrag-ui.secretName" . }}, key: DATABASE_URL }
            - name: WORKSPACES_DIR
              value: /data/workspaces
            # uvicorn --forwarded-allow-ips (not app config): the peer set
            # allowed to set X-Forwarded-For. The NetworkPolicy below already
            # restricts who can open a connection at all; this is the second
            # gate, so a spoofed client IP cannot mint a fresh login-rate-limit
            # bucket. Set it to the cluster pod CIDR to tighten further.
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.api.forwardedAllowIps | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "graphrag-ui.secretName" . }}, key: JWT_SECRET }
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: {{ include "graphrag-ui.secretName" . }}, key: BOOTSTRAP_ADMIN_EMAIL }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "graphrag-ui.secretName" . }}, key: BOOTSTRAP_ADMIN_PASSWORD }
            # Upload/quota/retention limits are plain values, not secrets
            - name: UPLOAD_MAX_FILE_MB
              value: {{ .Values.uploadMaxFileMb | quote }}
            - name: PROJECT_QUOTA_MB
              value: {{ .Values.projectQuotaMb | quote }}
            - name: MAX_CONCURRENT_JOBS
              value: {{ .Values.maxConcurrentJobs | quote }}
            - name: JOB_LOG_RETENTION_DAYS
              value: {{ .Values.jobLogRetentionDays | quote }}
            - name: JOB_LOG_FAILED_RETENTION_DAYS
              value: {{ .Values.jobLogFailedRetentionDays | quote }}
            - name: UPDATE_OUTPUT_KEEP_LATEST
              value: {{ .Values.updateOutputKeepLatest | quote }}
            - name: CACHE_QUOTA_MB
              value: {{ .Values.cacheQuotaMb | quote }}
            - name: DISK_WATERMARK_MB
              value: {{ .Values.diskWatermarkMb | quote }}
            - name: QUERY_CACHE_MB
              value: {{ .Values.queryCacheMb | quote }}
            - name: QUERY_RATE_LIMIT_PER_HOUR
              value: {{ .Values.queryRateLimitPerHour | quote }}
            {{- if .Values.proxyAuth.enabled }}
            # Proxy-auth mode (spec §7.2): identity arrives via trusted headers injected by oauth2-proxy
            - name: AUTH_MODE
              value: proxy
            - name: PROXY_ADMIN_EMAILS
              value: {{ join "," .Values.proxyAuth.adminEmails | quote }}
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "graphrag-ui.proxyAuthSecretName" . }}, key: proxy-auth-secret }
            {{- end }}
          volumeMounts:
            - name: workspaces
              mountPath: /data/workspaces
          livenessProbe:              # spec §8.2: /api/health as liveness
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30   # startup runs alembic migration first; allow ample first-run time
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:             # spec §8.2: /api/ready as readiness (checks the DB connection)
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "graphrag-ui.fullname" . }}-workspaces

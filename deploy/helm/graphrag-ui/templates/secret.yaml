{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphrag-ui.fullname" . }}-secret
  labels:
    {{- include "graphrag-ui.labels" . | nindent 4 }}
type: Opaque
# stringData renders in plaintext (handy for inspecting the connection string via helm template); the API server converts it to data
stringData:
  DATABASE_URL: {{ include "graphrag-ui.databaseUrl" . | quote }}
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.bootstrapAdmin.email | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.bootstrapAdmin.password | quote }}
{{- end }}

# GraphRAG Web UI Helm values(spec §8.2)
# All environment differences go through env vars (spec §8.3), sharing the
# same variable names as docker-compose:
# DATABASE_URL / WORKSPACES_DIR / JWT_SECRET / BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD /
# UPLOAD_MAX_FILE_MB / PROJECT_QUOTA_MB / MAX_CONCURRENT_JOBS / JOB_LOG_RETENTION_DAYS /
# JOB_LOG_FAILED_RETENTION_DAYS / UPDATE_OUTPUT_KEEP_LATEST / CACHE_QUOTA_MB / DISK_WATERMARK_MB /
# QUERY_CACHE_MB / QUERY_RATE_LIMIT_PER_HOUR

api:
  image: {}            # repository/tag, e.g. { repository: registry.example.com/graphrag-ui/api, tag: "0.1.0" }; empty = default name for local testing
  replicas: 1          # fixed at 1 (spec §8.2): the runner is tied to the workspace PVC (RWO); no horizontal scaling
  strategy: Recreate   # RWO PVC: during a rolling update two pods would fight over the same workspace; Recreate is mandatory
  terminationGracePeriodSeconds: 120  # lets in-flight indexing jobs finish or be cleanly marked interrupted (spec §8.2)
  # Measured peak RSS during full indexing ≈ 566 MiB (2026-08-21 final review);
  # spec §13 row 3 guidance: limit ≥ 2 GiB headroom above the measured peak.
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 500m, memory: 2Gi }

web:
  image: {}            # repository/tag, same as api.image
  replicas: 2

ingress:
  enabled: false
  className: ""        # e.g. nginx; must match the cluster's ingress controller
  host: ""             # e.g. graphrag.example.com; empty string = catch-all
  annotations:         # SSE: nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {}                 # (proxy-buffering off and the long read timeout are built into the template; put extra annotations here)

externalDatabase:
  url: ""              # e.g. postgresql+asyncpg://user:pw@host:5432/graphrag; required when postgresql.enabled=false

postgresql:
  enabled: true        # when false, externalDatabase.url must be set
  # Align with tests (testcontainers postgres:16-alpine); bitnami chart 18.x accepts PG16 tags.
  # Registry caveat: since Bitnami's 2025 reorg, Docker Hub has no public semver tags
  # (bitnami/postgresql:16.8.0 → 404 → ImagePullBackOff). Configure a registry mirror or
  # point image.registry/repository at a reachable source (e.g. repository: bitnamilegacy/postgresql).
  image: { tag: "16.8.0" }
  auth: { username: graphrag, password: "", database: graphrag }
  # Bundled-DB note: DATABASE_URL is assembled at render time with the
  # password taken from auth.password — set auth.password explicitly when the
  # bundled DB is enabled (leaving it empty yields a passwordless URL that
  # cannot connect in production)

persistence:
  size: 50Gi           # workspace PVC (ReadWriteOnce), mounted at the api's /data/workspaces

jwtSecret: ""          # via --set or existingSecret
existingSecret: ""     # when non-empty, the chart creates no Secret of its own and references the existing one;
                       # that Secret must contain 4 keys: DATABASE_URL / JWT_SECRET / BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD

bootstrapAdmin:
  # ⚠ The email must be a real routable domain, never .local — login
  #   validation rejects special-use domains; the account gets created but
  #   cannot log in (422), leaving the first deployment without an admin
  email: ""            # admin account created at first startup (empty string = do not create)
  password: ""

uploadMaxFileMb: 50    # UPLOAD_MAX_FILE_MB — single-file upload limit in MiB; exceed → 413
projectQuotaMb: 5000   # PROJECT_QUOTA_MB — per-project storage quota in MiB (input/+output/); exceed → 413
maxConcurrentJobs: 2   # MAX_CONCURRENT_JOBS — concurrent indexing jobs; 0 disables the runner loop
jobLogRetentionDays: 30        # JOB_LOG_RETENTION_DAYS — days to keep succeeded job log files
jobLogFailedRetentionDays: 90  # JOB_LOG_FAILED_RETENTION_DAYS — days to keep failed job log files
updateOutputKeepLatest: 2      # UPDATE_OUTPUT_KEEP_LATEST — update_output timestamp dirs kept per project
cacheQuotaMb: 2048     # CACHE_QUOTA_MB — cache volume quota reported by preflight, MiB
diskWatermarkMb: 2048  # DISK_WATERMARK_MB — min free MiB on workspaces volume; below → enqueue refused
queryCacheMb: 1024     # QUERY_CACHE_MB — LRU budget for cached query parquet frames (spec §6.4 amended
                       # 2026-08-22: 1 GiB fits within the shared 2 GiB pod limit; peak RSS measured
                       # 566/565 MiB while indexing, leaving headroom for query-time frames)
queryRateLimitPerHour: 30  # QUERY_RATE_LIMIT_PER_HOUR — max queries per (user, project) per hour → 429

proxyAuth:
  enabled: false        # OAuth2-Proxy in front of the app (spec 2026-08-27 §7.2);
                        # requires ingress.enabled and a concrete ingress.host
  external:
    url: ""             # e.g. https://sso.example.com — reuse a cluster-wide oauth2-proxy; chart ships none of its own
  provider: oidc
  issuerUrl: ""         # OIDC issuer URL
  clientId: ""
  clientSecret: ""      # plaintext fallbacks used only when existingSecret is empty;
  cookieSecret: ""      # all three feed the chart's proxy-auth Secret keys
  authSecret: ""        # PROXY_AUTH_SECRET — >= 32 chars, validated by the api at startup
  existingSecret: ""    # when set, must contain: client-secret, cookie-secret, proxy-auth-secret
  adminEmails: []       # PROXY_ADMIN_EMAILS — held at role=admin (spec §5.2)
  emailDomains: []      # REQUIRED when enabled (spec §7.1); ["*"] = open registration
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
  resources: {}

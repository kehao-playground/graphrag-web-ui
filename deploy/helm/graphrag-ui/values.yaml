# GraphRAG Web UI Helm values(spec §8.2)
# 環境差異全部走環境變數(spec §8.3),與 docker-compose 共用同一組變數名:
# DATABASE_URL / WORKSPACES_DIR / JWT_SECRET / BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD

api:
  image: {}            # repository/tag,例 { repository: registry.example.com/graphrag-ui/api, tag: "0.1.0" };空 = 本地測試用預設名
  replicas: 1          # 固定 1(spec §8.2):runner 與 workspace PVC(RWO)綁定,不做水平擴展
  strategy: Recreate   # RWO PVC:rolling update 期間兩個 pod 會搶同一份 workspace,必須 Recreate
  terminationGracePeriodSeconds: 120  # 讓進行中的 indexing 任務有機會收尾或乾淨標記中斷(spec §8.2)
  resources: {}        # 註解:indexing 子程序與查詢快取共用同一 limit;Phase 3 實測後給建議值

web:
  image: {}            # repository/tag,同 api.image
  replicas: 2

ingress:
  enabled: false
  className: ""        # 例 nginx;需對應叢集上的 ingress controller
  host: ""             # 例 graphrag.example.com;空字串 = catch-all
  annotations:         # SSE:nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {}                 # (proxy-buffering off 與長 read timeout 已由 template 內建,這裡放額外 annotation)

externalDatabase:
  url: ""              # 例 postgresql+asyncpg://user:pw@host:5432/graphrag;postgresql.enabled=false 時必填

postgresql:
  enabled: true        # false 時必須設定 externalDatabase.url
  auth: { username: graphrag, password: "", database: graphrag }
  # 內建 DB 注意:DATABASE_URL 於 render 時組出,密碼取自 auth.password —
  # 啟用內建 DB 時請明確設定 auth.password(留空則組出的 URL 沒有密碼,上線後連不上)

persistence:
  size: 50Gi           # workspace PVC(ReadWriteOnce),掛在 api 的 /data/workspaces

jwtSecret: ""          # --set 或 existingSecret
existingSecret: ""     # 非 "" 時不建立 chart 自己的 Secret,改引用既有 Secret;
                       # 該 Secret 需含 4 個 key:DATABASE_URL / JWT_SECRET / BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD

bootstrapAdmin:
  # ⚠ email 必須是真實可路由網域,不可用 .local — 登入驗證拒絕 special-use
  #   domains,帳號建立了也登不進去(422),首次部署即無 admin 可用
  email: ""            # 首次啟動建立的 admin 帳號(空字串 = 不建立)
  password: ""

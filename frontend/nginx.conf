server {
  # 8080, not 80: the image is nginx-unprivileged (uid 101), which cannot
  # bind a privileged port. The k8s Service and the compose port mapping
  # both still present 80/8080 externally.
  listen 8080;

  # Baseline hardening headers. `always` so they survive error responses
  # too. The SPA is same-origin with the api and loads no third-party
  # script/style/font, so the CSP can stay strict; 'unsafe-inline' for
  # style-src is required by antd's runtime-injected <style> tags, and
  # connect-src keeps the SSE/XHR surface on this origin. worker-src allows
  # blob: because graphology-layout-forceatlas2 ships a worker built from an
  # object URL — it is in the graph chunk whether or not we call it today,
  # and worker-src would otherwise fall back to the 'self'-only default-src.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # SSE lives under /api/jobs/{id}/logs. nginx buffers proxied responses
  # by default, which would batch the event stream into one delayed chunk
  # (Foundation-B lesson: must be verified through this real nginx path,
  # not only against the API directly). Longest-prefix match wins over the
  # generic /api/ location below, so the SSE path gets buffering off and a
  # read timeout that outlives hour-long indexing jobs.
  location /api/jobs/ {
    proxy_pass http://api:8000;
    # proxy_set_header does NOT inherit from a sibling location — only from
    # the enclosing block. Without repeating it here the api would see the
    # nginx container IP for every jobs request instead of the real client.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # how the api gets the real client IP (login rate limiting)
    proxy_buffering off;            # SSE backstop (spec §8.1); /api/jobs/ has its own explicit block
    proxy_read_timeout 3600s;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}

server {
  # SSE lives under /api/jobs/{id}/logs. nginx buffers proxied responses
  # by default, which would batch the event stream into one delayed chunk
  # (Foundation-B lesson: must be verified through this real nginx path,
  # not only against the API directly). Longest-prefix match wins over the
  # generic /api/ location below, so the SSE path gets buffering off and a
  # read timeout that outlives hour-long indexing jobs.
  location /api/jobs/ {
    proxy_pass http://api:8000;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # how the api gets the real client IP (login rate limiting)
    proxy_buffering off;            # SSE backstop (spec §8.1); /api/jobs/ has its own explicit block
    proxy_read_timeout 3600s;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}

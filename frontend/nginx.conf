# This file is included inside the image's `http {}` block, so the map and
# log_format below are http-level. The SSE routes (job logs, query stream)
# authenticate with `?ticket=` because EventSource cannot set headers; the
# stock `main` format logs the full request line, which would put the
# credential into `docker logs web` and the cluster log pipeline (R2-25,
# decision D5). A ticket is good for one path and one minute (F24-01) —
# what the error log, which has no configurable format, can still record.
# Any request whose query string carries a ticket (or an old client's
# token) is logged with its query string replaced.
map $args $request_redacted {
  "~(^|&)(token|ticket)=" "$request_method $uri?[redacted] $server_protocol";
  default        $request;
}
# index.html must never be reused from the browser's heuristic cache: behind
# oauth2-proxy a cached copy boots the SPA after sign-out without the request
# ever reaching the proxy (F25-02), and after an upgrade it would keep
# loading the previous build's asset names. Hashed assets stay cacheable.
map $sent_http_content_type $html_cache_control {
  "~^text/html" "no-cache";
  default       "";
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
  # 8080, not 80: the image is nginx-unprivileged (uid 101), which cannot
  # bind a privileged port. The k8s Service and the compose port mapping
  # both still present 80/8080 externally.
  listen 8080;
  # Replaces the image's http-level `access_log … main` for this server.
  access_log /var/log/nginx/access.log redacted;

  # Baseline hardening headers. `always` so they survive error responses
  # too. The SPA is same-origin with the api and loads no third-party
  # script/style/font, so the CSP can stay strict; 'unsafe-inline' for
  # style-src is required by antd's runtime-injected <style> tags, and
  # connect-src keeps the SSE/XHR surface on this origin. worker-src allows
  # blob: because graphology-layout-forceatlas2 ships a worker built from an
  # object URL — it is in the graph chunk whether or not we call it today,
  # and worker-src would otherwise fall back to the 'self'-only default-src.
  # Empty for non-HTML responses, and nginx then sends no header at all.
  add_header Cache-Control $html_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Uploads: nginx's default client_max_body_size is 1 MiB, which would
  # answer every larger POST /api/projects/{id}/files with an HTML 413
  # before the api sees it. The api owns the real cap (UPLOAD_MAX_FILE_MB,
  # default 50, plus the project quota) and answers with the JSON error
  # envelope the SPA understands, so nginx only needs to stay out of the
  # way: a generous fixed ceiling rather than a value templated from the
  # env at container start. Inherited by every location below.
  client_max_body_size 1g;

  # SSE lives under /api/jobs/{id}/logs. nginx buffers proxied responses
  # by default, which would batch the event stream into one delayed chunk
  # (Foundation-B lesson: must be verified through this real nginx path,
  # not only against the API directly). Longest-prefix match wins over the
  # generic /api/ location below, so the SSE path gets buffering off and a
  # read timeout that outlives hour-long indexing jobs.
  location /api/jobs/ {
    proxy_pass http://api:8000;
    # proxy_set_header does NOT inherit from a sibling location — only from
    # the enclosing block. Without repeating it here the api would see the
    # nginx container IP for every jobs request instead of the real client.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # how the api gets the real client IP (login rate limiting)
    proxy_buffering off;            # SSE backstop (spec §8.1); /api/jobs/ has its own explicit block
    proxy_read_timeout 3600s;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
